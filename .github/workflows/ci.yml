name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app || ls /Applications | grep Xcode
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Unit tests
        run: swift test
